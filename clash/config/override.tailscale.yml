# clash party format override file
# docs: https://clashparty.org/docs/guide/override/yaml

+proxies:
  # tailscale
  - name: "tailscale"
    type: tailscale
    udp: true
    exit-node: auto:any

dns:
  nameserver-policy:
    "+.ts.net": "tailscale://tailscale"

+rules:
  - DOMAIN-SUFFIX,ts.net,tailscale
  - IP-CIDR,100.64.0.0/10,tailscale,no-resolve
  - IP-CIDR6,fd7a:115c:a1e0::/48,tailscale,no-resolve
